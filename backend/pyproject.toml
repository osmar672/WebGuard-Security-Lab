[project]
name = "webguard-backend"
version = "0.9.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143.3,<1.0",
  "uvicorn[standard]>=0.34.0,<1.0",
  "sqlalchemy>=2.0.36,<3.0",
  "pydantic>=2.10.4,<3.0",
  "pydantic-settings>=2.7.0,<3.0",
  "alembic>=1.14.0,<2.0",
  "argon2-cffi>=23.1.0,<26.0",
  "PyJWT>=2.10.1,<3.0",
  "psycopg[binary]>=3.2.3,<4.0",
  "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4,<10.0", "httpx>=0.28.1,<1.0", "ruff>=0.8.4,<1.0", "pip-audit>=2.7,<3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
