[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webguard-scope-boundary"
version = "0.3.0"
description = "Reusable authorization and SSRF boundary for WebGuard Security Lab"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["webguard_scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
